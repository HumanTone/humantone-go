name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (go ${{ matrix.go }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23", "1.24"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code; then
            echo "go.mod (or go.sum if present) is not tidy. Run 'go mod tidy' locally."
            exit 1
          fi

      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck ./...

      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -1

  verify-version-matches-tag:
    name: verify SDKVersion matches git tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare SDKVersion to tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          CONSTANT=$(grep -oE 'SDKVersion = "[^"]+"' version.go | head -1 | sed -E 's/SDKVersion = "([^"]+)"/\1/')
          if [ -z "$CONSTANT" ]; then
            echo "Could not extract SDKVersion from version.go"
            exit 1
          fi
          if [ "$TAG" != "$CONSTANT" ]; then
            echo "Tag '$TAG' does not match SDKVersion '$CONSTANT'"
            exit 1
          fi
          echo "OK: tag $TAG matches SDKVersion $CONSTANT"
