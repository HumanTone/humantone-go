name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  github-release:
    name: GitHub release from tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Pull the section between the matching version header and the next "## " header.
          awk -v v="$VERSION" '
            BEGIN { collecting=0 }
            /^## \[/ {
              if (collecting) { exit }
              if (index($0, "[" v "]") > 0) { collecting=1; next }
            }
            collecting { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG entry found for $VERSION; using fallback message."
            echo "Release $TAG" > release_notes.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
